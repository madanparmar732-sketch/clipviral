# Optional: Render Blueprint file.
# You can also just create the Web Service manually in the Render dashboard
# (DEPLOYMENT.md shows both ways).
services:
  - type: web
    name: opusclip-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RECAP_ENABLED
        value: "false"
      # Set to "1" in the Render dashboard ONLY after the phone worker
      # is confirmed online — then Render becomes API-only and the phone renders.
      - key: CLIPVIRAL_PHONE_WORKER
        value: "0"
